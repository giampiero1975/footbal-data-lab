limit_req_zone $binary_remote_addr zone=rag_write:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=rag_poll:10m rate=60r/m;
log_format football_privacy '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent"';

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name football-lab.byoursite.com;

    ssl_certificate /etc/letsencrypt/live/football-lab.byoursite.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/football-lab.byoursite.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    access_log /var/log/nginx/footballlab.access.log football_privacy;

    client_max_body_size 16k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 930s;
    proxy_send_timeout 30s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /v1/query {
        limit_req zone=rag_write burst=5 nodelay;
        proxy_pass http://127.0.0.1:8088;
        include proxy_params;
    }

    location = /v1/feedback {
        limit_req zone=rag_write burst=5 nodelay;
        proxy_pass http://127.0.0.1:8088;
        include proxy_params;
    }

    location /v1/knowledge/search {
        limit_req zone=rag_write burst=5 nodelay;
        proxy_pass http://127.0.0.1:8088;
        include proxy_params;
    }

    location /v1/jobs/ {
        limit_req zone=rag_poll burst=20 nodelay;
        proxy_pass http://127.0.0.1:8088;
        include proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        include proxy_params;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name football-lab.byoursite.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

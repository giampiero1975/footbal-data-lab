limit_req_zone $binary_remote_addr zone=rag_write:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=rag_poll:10m rate=60r/m;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name footballlab.byoursite.com;

    ssl_certificate /etc/letsencrypt/live/footballlab.byoursite.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/footballlab.byoursite.com/privkey.pem;

    client_max_body_size 16k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 930s;
    proxy_send_timeout 30s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /v1/query {
        limit_req zone=rag_write burst=5 nodelay;
        proxy_pass http://127.0.0.1:8088;
        include proxy_params;
    }

    location = /v1/feedback {
        limit_req zone=rag_write burst=5 nodelay;
        proxy_pass http://127.0.0.1:8088;
        include proxy_params;
    }

    location /v1/knowledge/search {
        limit_req zone=rag_write burst=5 nodelay;
        proxy_pass http://127.0.0.1:8088;
        include proxy_params;
    }

    location /v1/jobs/ {
        limit_req zone=rag_poll burst=20 nodelay;
        proxy_pass http://127.0.0.1:8088;
        include proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        include proxy_params;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name footballlab.byoursite.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
